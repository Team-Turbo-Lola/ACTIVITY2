<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact and student feedback form">
    <title>Contact Us - Team Web Portfolio</title>
</head>

<body>

<header>
    <h1>Web Systems & Technology Team Project</h1>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="schedule.html">Schedule</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>
</header>

<main>

    <h1>Contact & Student Feedback</h1>

    <form action="#" method="POST">

        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname">
        <br><br>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email">
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <br><br>

        <p>User Role:</p>

        <input type="radio" id="student" name="role" value="student">
        <label for="student">Student</label>

        <input type="radio" id="teacher" name="role" value="teacher">
        <label for="teacher">Teacher</label>

        <br><br>

        <p>Interests:</p>

        <input type="checkbox" id="html" name="interest" value="html">
        <label for="html">HTML</label>

        <input type="checkbox" id="web" name="interest" value="web">
        <label for="web">Web Development</label>

        <br><br>

        <label for="message">Message:</label>
        <br>

        <textarea id="message" name="message" rows="5" cols="30"></textarea>

        <br><br>

        <label for="subject">Subject Category:</label>

        <select id="subject" name="subject">
            <option value="feedback">Feedback</option>
            <option value="question">Question</option>
            <option value="suggestion">Suggestion</option>
        </select>

        <br><br>

        <input type="submit" value="Submit">

        <input type="reset" value="Reset">

    </form>

</main>

<footer>
    <p>&copy; 2026 Web Systems & Technology Team Project</p>
</footer>

</body>
</html>
